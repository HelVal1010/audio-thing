<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dining Tableware Alignment (OCD Experience)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0e1017">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="./manifest.json">

  <!-- ONNX Runtime Web (Microsoft official WebAssembly/WebGL inference engine) -->
  <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.20.1/dist/ort.min.js"></script>

  <style>
    :root {
      --bg: #0e1017;
      --card: rgba(22, 25, 35, 0.88);
      --line: rgba(255, 255, 255, 0.12);
      --fg: #eceef4;
      --mut: #8b92a5;
      --ac: #7cc4ff;
      --ok: #5cc98a;
      --warn: #e0a03f;
      --err: #e05a4f;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      background: #000;
      color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      user-select: none;
    }

    /* Fullscreen camera canvas */
    #viewport {
      position: absolute;
      inset: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      overflow: hidden;
    }

    #cameraVideo {
      display: none;
    }

    #renderCanvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Top HUD Header */
    .top-hud {
      position: absolute;
      top: env(safe-area-inset-top, 12px);
      left: 12px;
      right: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
      z-index: 10;
    }

    .brand {
      background: var(--card);
      backdrop-filter: blur(12px);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 6px 14px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 600;
    }

    .badge {
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 10px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }
    .badge.loading { background: #3b3010; color: #f4c542; }
    .badge.ready { background: #163625; color: var(--ok); }
    .badge.live { background: #14324f; color: var(--ac); }
    .badge.error { background: #3f1614; color: var(--err); }

    .stats {
      background: var(--card);
      backdrop-filter: blur(12px);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 6px 12px;
      display: flex;
      gap: 10px;
      font-size: 12px;
      color: var(--mut);
    }
    .stats span { color: var(--fg); font-weight: 600; }

    /* Bottom Control & Explainability HUD */
    .bottom-hud {
      position: absolute;
      bottom: env(safe-area-inset-bottom, 14px);
      left: 12px;
      right: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      z-index: 10;
    }

    /* Diagnostics Card */
    .diag-card {
      background: var(--card);
      backdrop-filter: blur(16px);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 12px 14px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.45);
    }

    .diag-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .diag-title {
      font-size: 13px;
      font-weight: 700;
      color: var(--mut);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .status-tag {
      font-size: 11px;
      font-weight: 800;
      padding: 3px 8px;
      border-radius: 8px;
      letter-spacing: 0.5px;
    }
    .status-tag.harmonious { background: rgba(92,201,138,0.2); color: var(--ok); }
    .status-tag.disharmony { background: rgba(224,90,79,0.2); color: var(--err); }

    /* Ear Tension Meters */
    .meters-row {
      display: grid;
      grid-template-columns: 1fr 1fr 54px;
      gap: 10px;
      align-items: center;
      margin-bottom: 10px;
    }

    .meter-wrap {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .meter-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--mut);
      display: flex;
      justify-content: space-between;
    }

    .meter-track {
      height: 8px;
      background: rgba(255,255,255,0.08);
      border-radius: 4px;
      overflow: hidden;
    }

    .meter-fill {
      height: 100%;
      width: 0%;
      background: var(--ok);
      transition: width 0.12s ease-out, background 0.12s ease-out;
    }

    /* Harmony Ring */
    .ring-wrap {
      width: 54px;
      height: 54px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .ring-wrap svg {
      transform: rotate(-90deg);
      width: 54px;
      height: 54px;
    }

    .ring-bg {
      stroke: rgba(255,255,255,0.08);
      stroke-width: 5;
      fill: none;
    }

    .ring-bar {
      stroke: var(--ok);
      stroke-width: 5;
      stroke-linecap: round;
      fill: none;
      stroke-dasharray: 163.3;
      stroke-dashoffset: 163.3;
      transition: stroke-dashoffset 0.15s ease-out;
    }

    .ring-label {
      position: absolute;
      font-size: 10px;
      font-weight: 800;
      color: var(--ok);
    }

    /* Diagnostic reasons list */
    .diag-list {
      margin: 0;
      padding: 0 0 0 16px;
      font-size: 12px;
      color: var(--fg);
      line-height: 1.45;
    }
    .diag-list li { margin-bottom: 3px; }

    /* Clean View / Hidden UI mode for Screen Recording */
    .top-hud, .bottom-hud {
      transition: opacity 0.25s ease, transform 0.25s ease;
    }

    body.ui-hidden .top-hud {
      opacity: 0;
      pointer-events: none;
      transform: translateY(-25px);
    }

    body.ui-hidden .bottom-hud {
      opacity: 0;
      pointer-events: none;
      transform: translateY(25px);
    }

    /* Minimal floating restore pill bar when UI is hidden */
    #restoreBar {
      position: absolute;
      top: env(safe-area-inset-top, 14px);
      right: 14px;
      z-index: 50;
      display: none;
      align-items: center;
      gap: 8px;
    }

    body.ui-hidden #restoreBar {
      display: flex;
    }

    #restoreBar button {
      background: rgba(14, 16, 23, 0.75);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 20px;
      padding: 6px 14px;
      font-size: 12px;
      font-weight: 700;
      color: rgba(255, 255, 255, 0.95);
      cursor: pointer;
      touch-action: manipulation;
    }

    /* Collapsible diagnostics card */
    .diag-card.collapsed .diag-list {
      display: none;
    }
    .diag-card.collapsed .meters-row {
      margin-bottom: 0;
    }

    .icon-btn {
      padding: 2px 8px;
      font-size: 11px;
      border-radius: 6px;
      background: rgba(255,255,255,0.08);
      border: 1px solid var(--line);
      cursor: pointer;
    }

    /* Action Toolbar */
    .actions {
      display: flex;
      gap: 8px;
      justify-content: space-between;
      flex-wrap: wrap;
    }

    button {
      background: var(--card);
      backdrop-filter: blur(12px);
      border: 1px solid var(--line);
      color: var(--fg);
      font-size: 13px;
      font-weight: 600;
      padding: 10px 14px;
      border-radius: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
      touch-action: manipulation;
    }

    button:active {
      transform: scale(0.96);
      background: rgba(255,255,255,0.14);
    }

    /* Record Demo Button */
    #recordBtn {
      background: rgba(224, 90, 79, 0.2);
      border-color: rgba(224, 90, 79, 0.4);
      color: #ff9187;
      flex: 1;
      justify-content: center;
      font-weight: 700;
    }

    #recordBtn.recording {
      background: rgba(224, 90, 79, 0.85);
      border-color: #ff5a4f;
      color: #fff;
    }

    .rec-dot {
      width: 10px;
      height: 10px;
      background: #ff5a4f;
      border-radius: 50%;
    }

    .rec-dot.active {
      animation: pulse 1s infinite;
      background: #fff;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.3; transform: scale(1.3); }
    }

    #audioBtn.muted {
      color: var(--mut);
      background: rgba(255,255,255,0.06);
    }

    /* Landscape mode optimization on mobile devices */
    @media (orientation: landscape) and (max-height: 520px) {
      .top-hud {
        top: env(safe-area-inset-top, 6px);
        left: env(safe-area-inset-left, 10px);
        right: env(safe-area-inset-right, 10px);
      }
      .brand {
        padding: 4px 10px;
        font-size: 12px;
      }
      .stats {
        padding: 4px 10px;
        font-size: 11px;
      }
      .bottom-hud {
        bottom: env(safe-area-inset-bottom, 6px);
        left: env(safe-area-inset-left, 10px);
        right: env(safe-area-inset-right, 10px);
        gap: 6px;
      }
      .diag-card {
        padding: 6px 10px;
      }
      .diag-list {
        display: none;
      }
      .meters-row {
        margin-bottom: 2px;
      }
      .actions button {
        padding: 6px 10px;
        font-size: 11px;
      }
    }
  </style>
</head>
<body>

  <!-- Floating Restore UI & Fullscreen pill bar when in clean screen-recording mode -->
  <div id="restoreBar">
    <button id="restoreUiBtn"><span>👁️</span> Show UI</button>
    <button id="restoreFsBtn" title="Toggle Fullscreen"><span>⛶</span></button>
  </div>

  <!-- Fullscreen Camera Viewport -->
  <div id="viewport">
    <video id="cameraVideo" playsinline autoplay muted></video>
    <canvas id="renderCanvas"></canvas>
  </div>

  <!-- Top Header HUD -->
  <div class="top-hud">
    <div class="brand">
      <span>OCD Tableware</span>
      <span id="statusBadge" class="badge loading">INITIALIZING...</span>
    </div>
    <div class="stats">
      <div>FPS: <span id="fpsTag">0</span></div>
      <div>AI: <span id="inferTag">0 ms</span></div>
    </div>
  </div>

  <!-- Bottom Control & Diagnostics HUD -->
  <div class="bottom-hud">

    <!-- Diagnostic Explainability Card -->
    <div id="diagCard" class="diag-card">
      <div class="diag-header">
        <div style="display:flex;align-items:center;gap:8px;">
          <span class="diag-title">Real-Time Explainability</span>
          <button id="collapseDiagBtn" class="icon-btn" title="Minimize card">—</button>
        </div>
        <span id="diagStatus" class="status-tag harmonious">HARMONIOUS</span>
      </div>

      <!-- Ear Tension & Harmony Ring -->
      <div class="meters-row">
        <div class="meter-wrap">
          <div class="meter-label">
            <span>Left Ear (Fork)</span>
          </div>
          <div class="meter-track">
            <div id="leftMeter" class="meter-fill"></div>
          </div>
        </div>

        <div class="meter-wrap">
          <div class="meter-label">
            <span>Right Ear (Spoon)</span>
          </div>
          <div class="meter-track">
            <div id="rightMeter" class="meter-fill"></div>
          </div>
        </div>

        <!-- Harmony Circle -->
        <div class="ring-wrap" title="Harmony Progress">
          <svg viewBox="0 0 60 60">
            <circle class="ring-bg" cx="30" cy="30" r="26"></circle>
            <circle id="harmonyCircle" class="ring-bar" cx="30" cy="30" r="26"></circle>
          </svg>
          <span class="ring-label">OCD</span>
        </div>
      </div>

      <!-- Live Diagnostic Reasons -->
      <ul id="diagList" class="diag-list">
        <li>Align fork and spoon perpendicular to tray edge.</li>
      </ul>
    </div>

    <!-- Actions Toolbar -->
    <div class="actions">
      <button id="recordBtn">
        <div id="recordDot" class="rec-dot"></div>
        <span id="recordText">Record Demo</span>
        <span id="recordTimer" style="font-variant-numeric: tabular-nums;" hidden>00:00</span>
      </button>

      <button id="fsBtn" title="Toggle Fullscreen">
        <span>⛶</span> Fullscreen
      </button>

      <button id="hideUiBtn" title="Hide all UI for clean screen recording">
        <span>👁️</span> Hide UI
      </button>

      <button id="overlayBtn" title="Toggle tracking lines on/off">
        <span>📐</span> Lines On
      </button>

      <button id="audioBtn" class="muted">
        <span>🔇</span> Muted
      </button>

      <button id="flipCamBtn" title="Flip Camera">
        <span>🔄</span> Flip
      </button>
    </div>

  </div>

  <!-- Scripts -->
  <script src="./audio.js"></script>
  <script src="./recorder.js"></script>
  <script src="./tracker.js"></script>
  <script src="./app.js"></script>

</body>
</html>
